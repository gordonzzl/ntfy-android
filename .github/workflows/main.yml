name: Build Custom Ntfy APK

on:
  workflow_dispatch:
    inputs:
      topic_name:
        description: '1. 请输入你要打包的校区主题名 (英文字母，如: sc_137)'
        required: true
        default: 'sc_'
      display_name:
        description: '2. 请输入App里显示的中文名称 (如: 石河子职业技术大学(主校区))'
        required: true
        default: ''

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Inject Dynamic Topic and Display Name
        run: |
          sed -i "s/BUILD_TIME_TOPIC_PLACEHOLDER/${{ github.event.inputs.topic_name }}/g" app/src/main/java/io/heckel/ntfy/ui/MainActivity.kt
          sed -i "s/BUILD_TIME_DISPLAY_NAME_PLACEHOLDER/${{ github.event.inputs.display_name }}/g" app/src/main/java/io/heckel/ntfy/ui/MainActivity.kt

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build APK (F-Droid Release)
        run: ./gradlew assembleFdroidRelease

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: rider_apk_${{ github.event.inputs.topic_name }}
          path: app/build/outputs/apk/fdroid/release/*-unsigned.apk
