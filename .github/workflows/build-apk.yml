name: Build Custom Ntfy APK

on:
  workflow_dispatch:
    inputs:
      topic_name:
        description: '请输入你要打包的校区主题名 (例如: school_suzhou)'
        required: true
        default: 'school_suzhou'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Inject Dynamic Topic
        run: |
          sed -i "s/BUILD_TIME_TOPIC_PLACEHOLDER/${{ github.event.inputs.topic_name }}/g" app/src/main/java/io/heckel/ntfy/ui/MainActivity.kt

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # 这里的编译命令已修改为官方最新的纯净版任务：assembleFossRelease
      - name: Build APK (FOSS Release)
        run: ./gradlew assembleFossRelease

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: rider_apk_${{ github.event.inputs.topic_name }}
          # 这里的导出路径也对应修改为 foss
          path: app/build/outputs/apk/foss/release/*-unsigned.apk
